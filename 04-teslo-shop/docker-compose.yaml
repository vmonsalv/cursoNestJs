version: '3'

services:
  db:
    image: mysql:8
    restart: always
    ports:
      - 5432:5432
    environment:
      - MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE: ${DB_DATABASE}
      # MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD
    container_name: tesloMysqlDB
    volumes:
      - ./mysql:/var/lib/mysql